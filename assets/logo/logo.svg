<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e13" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Hexagonal 'P' Emblem -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#logo-grad)" filter="url(#glow)" />
    <!-- Stylized White 'P' Path inside Emblem -->
    <path d="M14 10 H24 C27.5 10 30 12.5 30 16 C30 19.5 27.5 22 24 22 H19 V30 H14 V10 Z M19 14 V18 H23.5 C24.8 18 25.8 17.1 25.8 16 C25.8 14.9 24.8 14 23.5 14 H19 Z" fill="#ffffff" />
    <circle cx="28" cy="28" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="56" y="32" font-family="'Outfit', system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5" fill="currentColor">
    PRODESK <tspan fill="#ff5e13">IT</tspan>
  </text>
</svg>
